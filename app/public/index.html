<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoanLens · Portfolio Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">LoanLens</span>
    <nav aria-label="Main">
      <a href="/" aria-current="page">Dashboard</a>
      <a href="/calculator">EMI Calculator</a>
    </nav>
  </header>

  <main>
    <h1>Portfolio Dashboard</h1>

    <section class="toolbar" aria-label="Filters">
      <label for="type-filter">Loan type</label>
      <select id="type-filter" name="type">
        <option value="">All</option>
        <option>Home</option>
        <option>Car</option>
        <option>Personal</option>
        <option>Education</option>
      </select>
    </section>

    <section class="cards" aria-label="Portfolio summary">
      <article class="card"><h2>Active loans</h2><p data-testid="stat-count">–</p></article>
      <article class="card"><h2>Total principal</h2><p data-testid="stat-principal">–</p></article>
      <article class="card"><h2>Monthly EMI collections</h2><p data-testid="stat-emi">–</p></article>
      <article class="card"><h2>Total interest receivable</h2><p data-testid="stat-interest">–</p></article>
    </section>

    <div class="grid">
      <section class="panel" aria-labelledby="mix-heading">
        <h2 id="mix-heading">Principal by loan type</h2>
        <div id="type-pie" class="pie"></div>
      </section>

      <section class="panel" aria-labelledby="loans-heading">
        <h2 id="loans-heading">Loans</h2>
        <table aria-labelledby="loans-heading">
          <thead>
            <tr><th scope="col">Loan ID</th><th scope="col">Borrower</th><th scope="col">Type</th>
              <th scope="col">Principal</th><th scope="col">Rate</th><th scope="col">Tenure</th><th scope="col">EMI</th></tr>
          </thead>
          <tbody id="loan-rows"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="/js/emi.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
